<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is an explosion proof radio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An explosion proof radio is a two-way communication device certified under ATEX or IECEx standards for use in explosive atmospheres. The device limits electrical and thermal energy so it cannot ignite flammable gases, vapours or dust. Most ATEX radios use intrinsic safety (Ex ib) protection, meaning the circuits are designed so that no fault condition can produce enough energy to cause ignition."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between DMR, TETRA, and PoC radios?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "DMR (Digital Mobile Radio) is an open standard for digital two-way radio, widely used in commercial and industrial settings. TETRA (Terrestrial Trunked Radio) is a mission-critical standard used by emergency services and large industrial operations, offering group calls, encryption, and high reliability. PoC (Push-to-Talk over Cellular) radios use 4G/5G mobile networks instead of dedicated radio infrastructure, offering wider coverage but depending on cellular availability."
      }
    },
    {
      "@type": "Question",
      "name": "Can I use a normal radio in a hazardous area?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Standard two-way radios are not certified for explosive atmospheres and can produce sparks or heat sufficient to ignite flammable gases or dust. Only ATEX or IECEx certified radios may be used in classified hazardous areas. Using uncertified equipment in a Zone 1 or Zone 2 area is a notifiable offence under DSEAR (UK) and the ATEX Worker Protection Directive 1999/92/EC (EU)."
      }
    },
    {
      "@type": "Question",
      "name": "What certifications are required for a radio in Zone 1?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A radio used in Zone 1 requires Equipment Group II Category 2G certification. In the EU/EEA, ATEX certification under Directive 2014/34/EU is mandatory. For international deployments, IECEx certification is accepted in over 30 countries. The protection concept is typically Ex ib (intrinsic safety). Dual-certified devices (both ATEX and IECEx) provide maximum deployment flexibility."
      }
    },
    {
      "@type": "Question",
      "name": "Which explosion proof radio is best for oil and gas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For oil and gas operations, DMR radios like the Motorola DP4401Ex or DP4801Ex are widely deployed due to their robust DMR Tier II/III capabilities, GPS tracking, and Man Down safety features. For sites with existing TETRA infrastructure, the Motorola MTP8550Ex or Sepura STP8X000 provide mission-critical voice with end-to-end encryption. All are Zone 1 IIC T4 certified, covering hydrogen-class atmospheres found in refineries."
      }
    }
  ]
}
</script>

const grid = document.getElementById('cardGrid');

function score5(n){
  let s='';for(let i=0;i<5;i++){s+=`<span class="score-seg ${i<n?'on':''}"></span>`;}return`<span class="score-track">${s}</span>`;
}
function yn(v){
  if(v===true||v==='Yes') return `<span class="badge badge-green"><span class="hb !w-[6px] !h-[6px]"></span>Yes</span>`;
  if(v===false||v==='No') return `<span class="badge badge-stone">No</span>`;
  return `<span class="chip">\u2014</span>`;
}
function certMark(s){
  const list=[];
  list.push(s.atex?`<span class="chip">ATEX</span>`:`<span class="chip" style="opacity:.4;text-decoration:line-through">ATEX</span>`);
  list.push(s.iecex?`<span class="chip">IECEx</span>`:`<span class="chip" style="opacity:.4;text-decoration:line-through">IECEx</span>`);
  return list.join(' ');
}

          <div class="spec"><span class="spec-label">Bluetooth</span><span class="spec-val">${yn(s.bluetooth)}</span></div>
          <div class="spec"><span class="spec-label">Encryption</span><span class="spec-val text-[12px]">${s.encryption}</span></div>
          <div class="spec"><span class="spec-label">Display</span><span class="spec-val text-[12px]">${s.display}</span></div>
          <div class="spec"><span class="spec-label">Ex notation</span><span class="spec-val">${s.notation}</span></div>
        </div>
      </div>

      <div class="card-expand px-7 pb-6">
        <div class="h-px bg-[color:var(--border)] mb-5"></div>
        <div class="mono text-[11px] text-[color:var(--ash)] uppercase tracking-wider mb-2">Deployment note</div>
        <p class="text-[14.5px] leading-[1.6] text-[color:var(--graphite)]">${s.note}</p>
        <div class="mt-4 flex flex-wrap items-center gap-2">
          <span class="chip-dark chip">${s.notation}</span>
          ${s.zones.map(z=>`<span class="chip">${z.replace('zone','Zone ')}</span>`).join('')}
          <span class="chip">${s.ip}</span>
          <span class="chip">${s.tech}</span>
        </div>
      </div>

      <button class="card-toggle w-full px-7 py-3.5 border-t border-[color:var(--border)] flex items-center justify-between text-left hover:bg-[color:var(--bg-alt)] transition">
        <span class="text-[13px] text-[color:var(--graphite)]">Expand spec & deployment note</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="#888880" stroke-width="1.6" fill="none"/></svg>
      </button>
    </article>`).join('');

  document.querySelectorAll('.card-toggle').forEach(b=>{
    b.addEventListener('click',e=>e.currentTarget.closest('.card').classList.toggle('open'));
  });
  document.querySelectorAll('.cmp-cb').forEach(cb=>cb.addEventListener('change',onCompareChange));
}
renderCards();

// Filtering
const filters={zone:new Set(),cert:new Set(),tech:new Set(),band:new Set()};
document.querySelectorAll('#filterBar .pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const k=btn.dataset.filter,v=btn.dataset.val;
    const pressed=btn.getAttribute('aria-pressed')==='true';
    btn.setAttribute('aria-pressed',String(!pressed));
    if(pressed) filters[k].delete(v); else filters[k].add(v);
    applyFilters();
  });
});
document.getElementById('clearFilters').addEventListener('click',()=>{
  Object.values(filters).forEach(s=>s.clear());
  document.querySelectorAll('#filterBar .pill').forEach(b=>b.setAttribute('aria-pressed','false'));
  applyFilters();
});
function applyFilters(){
  let n=0;
  document.querySelectorAll('#cardGrid .card').forEach(card=>{
    const zones=card.dataset.zones.split(',');
    const atex=card.dataset.atex==='true',iecex=card.dataset.iecex==='true';
    const tech=card.dataset.tech,band=card.dataset.band;
    let pass=true;
    if(filters.zone.size) pass=pass&&[...filters.zone].some(z=>zones.includes(z));
    if(filters.cert.size) pass=pass&&(filters.cert.has('atex')?atex:true)&&(filters.cert.has('iecex')?iecex:true);
    if(filters.tech.size) pass=pass&&filters.tech.has(tech);
    if(filters.band.size) pass=pass&&filters.band.has(band);
    card.style.display=pass?'':'none';
    if(pass) n++;
  });
  document.getElementById('resultCount').textContent=n;
}

// Compare
const compareSet=new Set();
const compareBar=document.getElementById('compareBar');
const cmpN=document.getElementById('cmpN');
const compareCount=document.getElementById('compareCount');
const cmpTable=document.getElementById('cmpTable');

function onCompareChange(e){
  const id=e.target.dataset.id;
  if(e.target.checked){
    if(compareSet.size>=3){e.target.checked=false;return;}
    compareSet.add(id);
  } else compareSet.delete(id);
  refreshCompare();
}
function refreshCompare(){
  cmpN.textContent=compareSet.size;
  compareCount.textContent=compareSet.size;
  if(compareSet.size>0) compareBar.classList.add('show'); else compareBar.classList.remove('show');
  const sels=SOLUTIONS.filter(s=>compareSet.has(s.id));
  if(!sels.length){cmpTable.innerHTML='';return;}
  const rows=[
    ['Type',s=>s.type],['Technology',s=>s.tech],['Band',s=>s.band],['Zone',s=>s.zone],
    ['ATEX',s=>s.atex?'Yes':'No'],['IECEx',s=>s.iecex?'Yes':'No'],
    ['Gas group',s=>s.gas],['Temp class',s=>s.temp],['IP rating',s=>s.ip],
    ['TX power',s=>s.power],['Channels',s=>s.channels],
    ['Battery',s=>s.battery],['Battery life',s=>s.batteryLife],['Weight',s=>s.weight],
    ['Man Down',s=>s.manDown?'Yes':'No'],['GPS',s=>s.gps?'Yes':'No'],
    ['Bluetooth',s=>s.bluetooth?'Yes':'No'],['Encryption',s=>s.encryption],
    ['Display',s=>s.display],['Ex notation',s=>s.notation],['Score',s=>`${s.score}/5`]
  ];
  cmpTable.innerHTML=`<thead><tr>
    <th class="!w-[22%]">Spec</th>
    ${sels.map(s=>`<th class="!text-[color:var(--ink)] !normal-case !text-[13px]"><div class="serif text-[17px] leading-tight">${s.name}</div><div class="mono text-[11px] text-[color:var(--ash)] mt-1">${s.vendor}</div></th>`).join('')}
  </tr></thead>
  <tbody>${rows.map(([l,fn])=>`<tr><td class="text-[color:var(--ash)]">${l}</td>${sels.map(s=>`<td class="mono">${fn(s)}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
document.getElementById('compareToggle').addEventListener('click',()=>{
  if(compareSet.size===0){
    const y=document.getElementById('solutions').getBoundingClientRect().top+window.scrollY-80;
    window.scrollTo({top:y,behavior:'smooth'});
  } else compareBar.classList.toggle('show');
});
document.getElementById('cmpClose').addEventListener('click',()=>compareBar.classList.remove('show'));
document.getElementById('cmpClear').addEventListener('click',()=>{
  compareSet.clear();document.querySelectorAll('.cmp-cb').forEach(cb=>cb.checked=false);refreshCompare();
});

// Contact form
const cf=document.getElementById('contactForm');
if(cf) cf.addEventListener('submit',async function(e){
  e.preventDefault();
  const btn=cf.querySelector('button[type=submit]');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const r=await fetch(cf.action,{method:'POST',body:new FormData(cf),headers:{'Accept':'application/json'}});
    if(r.ok){cf.reset();cf.style.display='none';document.getElementById('formSuccess').classList.remove('hidden');}
    else{btn.textContent='Error — try again';btn.disabled=false;}
  }catch{btn.textContent='Error — try again';btn.disabled=false;}
});
</script>

document.querySelectorAll('#mobileMenu a').forEach(function(a){a.addEventListener('click',function(){document.getElementById('mobileMenu').classList.add('hidden');});});
</script>
