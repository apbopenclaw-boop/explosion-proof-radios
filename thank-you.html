<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thank You — Explosion Proof Radios</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--bg-alt:#f5f3f0;--ink:#1a1a1a;--border:#e0ddd8;--radius:10px;}
  html,body{background:var(--bg-alt);color:var(--ink);}
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}
  .serif{font-family:'Instrument Serif','Times New Roman',serif;font-weight:400;letter-spacing:-0.01em;line-height:1.1;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-ligatures:none;}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-[480px] text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-6 bg-green-50 border border-green-200">
      <svg class="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <div class="mono text-[11px] opacity-60 uppercase tracking-wider mb-3">§ Message sent</div>
    <h1 class="serif text-[36px] mb-3">Thank you</h1>
    <p class="text-[14.5px] opacity-70 leading-relaxed mb-8">Your message has been received. We'll get back to you as soon as possible.</p>
    <a href="/" class="inline-block px-6 py-2.5 bg-[color:var(--ink)] text-white rounded-[var(--radius)] text-[14px] font-medium hover:opacity-90 transition">Back to home</a>
  </div>
</body>
</html>
